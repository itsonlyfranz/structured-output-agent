[project]
name = "structured-output-agent"
version = "0.1.0"
description = "LLM agent that enforces Pydantic JSON schemas, validates tool responses, retries on parse errors, and logs validation failures."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
soa = "structured_output_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/structured_output_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
